[project]
name = "llm-wrapper"
version = "0.1.0"
description = "LiteLLM custom provider (wrapper/auto): egress redaction, restore, size checks, routing and local tracing"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
re2 = ["google-re2>=1.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
wrapper = "llm_wrapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_wrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
